server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This UI drives on-air changeover hardware — keep it out of frames and
    # stop browsers guessing content types.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Vite emits content-hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin to a stale bundle
    # after a redeploy and silently keep running the old UI.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Single-page app: the UI keeps view state in React, not the URL, but
    # this keeps deep links / refreshes working if routes are ever added.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
